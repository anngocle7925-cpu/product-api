services:
  mongodb:
    image: mongo:7
    container_name: nammongodb
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db

  product-api:
    build: .
    container_name: product-api
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/${DB_NAME:-productdb}
    depends_on:
      - mongodb

volumes:
  mongo_data:
