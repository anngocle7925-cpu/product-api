name: Deploy to Local Docker Engine

on:
  workflow_run:
    workflows: ["CD to Docker Hub"]
    types: [completed]
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: [self-hosted, local-docker]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Pull latest image from Docker Hub
        shell: powershell
        run: |
          $ok = $false
          for ($i = 1; $i -le 3; $i++) {
            docker compose -f docker-compose-prod.yaml pull
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Host "Pull failed (attempt $i), retrying in 10s..."
            Start-Sleep -Seconds 10
          }
          if (-not $ok) { Write-Host "WARNING: pull failed, using images already on this machine" }
          exit 0

      - name: Deploy
        shell: powershell
        run: docker compose -f docker-compose-prod.yaml up -d

      - name: Wait for healthy
        shell: powershell
        run: |
          for ($i = 1; $i -le 30; $i++) {
            $api = docker inspect --format '{{.State.Health.Status}}' product-api-prod 2>$null
            $mongo = docker inspect --format '{{.State.Health.Status}}' nammongodb-prod 2>$null
            Write-Host "api=$api mongo=$mongo"
            if ($api -eq 'healthy' -and $mongo -eq 'healthy') { exit 0 }
            Start-Sleep -Seconds 5
          }
          docker compose -f docker-compose-prod.yaml logs
          exit 1

      - name: Smoke test
        shell: powershell
        run: |
          $base = "http://localhost:3001"
          $pid1 = "CI" + [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
          function Check($name, $expected, $actual) {
            if ($expected -eq $actual) { Write-Host "PASS: $name ($actual)" }
            else { Write-Host "FAIL: $name (expected $expected, got $actual)"; exit 1 }
          }
          function Code($method, $url, $body) {
            try {
              if ($body) { $r = Invoke-WebRequest -Method $method -Uri $url -ContentType "application/json" -Body $body -UseBasicParsing }
              else { $r = Invoke-WebRequest -Method $method -Uri $url -UseBasicParsing }
              return [int]$r.StatusCode
            } catch { return [int]$_.Exception.Response.StatusCode }
          }
          Check "GET /health" 200 (Code "GET" "$base/health" $null)
          Check "POST /products" 201 (Code "POST" "$base/products" "{`"pid`":`"$pid1`",`"pname`":`"CI Item`",`"price`":10,`"quantity`":5}")
          Check "GET /products" 200 (Code "GET" "$base/products" $null)
          Check "GET /products/:pid" 200 (Code "GET" "$base/products/$pid1" $null)
          Check "PUT /products/:pid" 200 (Code "PUT" "$base/products/$pid1" '{"price":99}')
          Check "DELETE /products/:pid" 200 (Code "DELETE" "$base/products/$pid1" $null)
          Check "GET deleted product" 404 (Code "GET" "$base/products/$pid1" $null)
          Write-Host "ALL TESTS PASSED"