name: Test Product CI (simple)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  simple-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: |
          node --check src/server.js
          node --check src/models/Product.js

      - name: Build Docker image
        run: docker build -t product-api:ci .
