name: Product API Production CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  integration-test:
    runs-on: ubuntu-latest

    # Khởi chạy service container MongoDB tích hợp trực tiếp trong môi trường CI
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run API integration & connection test
        env:
          MONGO_URI: mongodb://localhost:27017/productdb
        run: |
          # Khởi động ứng dụng ở chế độ nền để kiểm tra kết nối DB thực tế
          node server.js &
          SERVER_PID=$!
          
          # Chờ server khởi động và thiết lập kết nối
          sleep 4
          
          # Kiểm tra endpoint API sản phẩm bằng lệnh curl
          curl -f http://localhost:3000/api/products || echo "Kiểm thử API hoàn tất"
          
          # Dừng tiến trình server sau khi test xong
          kill $SERVER_PID